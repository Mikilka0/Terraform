<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terraform - Global Greening</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-container">
      <!--1. Візуальна сітка & Ефекти задьного плану-->
      <!-- Піксельна сітка-сканер -->
      <div class="pixel-grid-overlay">
        <canvas id="pixel-canvas"></canvas>
      </div>

      <!-- Лінії сітки (візуальні) -->
      <div class="grid-line line-v-left"></div>
      <div class="grid-line line-v-center"></div>
      <div class="grid-line line-v-right"></div>
      <div class="grid-line line-h-top"></div>
      <div class="grid-line line-h-bottom"></div>

      <!-- 2. Хеддер -->
      <header class="header">
        <div class="logo">✺ TERRAFORM</div>
        <nav class="nav-links">
          <a href="#">PROJECTS</a>
          <a href="#">TECHNOLOGY</a>
          <a href="#">IMPACT</a>
        </nav>
        <div class="header-cta">JOIN INITIATIVE ↗</div>
      </header>

      <!-- 3. Головний контент & Інтерактивна Зона -->
      <main class="main-content">
        <!-- Блок з текстом зліва знизу -->
        <div class="title-block">
          <h1 class="title-sans">Lifeless matter</h1>
          <h1 class="title-serif">Living ecosystems</h1>
        </div>

        <!-- Центральний камінь -->
        <div class="reveal-container" id="reveal-container">
          <img src="./images/rock_1.jpg" alt="Barren Rock" class="base-layer" />
          <img
            src="./images/rock_2_1.jpg"
            alt="Flourishing Biome"
            class="reveal-layer"
            id="reveal-layer"
          />
        </div>

        <!-- Блок з описом справа зверху -->
        <div class="info-block">
          <p class="info-text">
            We restore devastated landscapes, breathing life into sterile
            environments through advanced ecological terraforming.
          </p>
          <a
            href="impact.html"
            class="solid-btn"
            style="
              text-decoration: none;
              display: inline-block;
              box-sizing: border-box;
            "
            >SEE IMPACT</a
          >
        </div>
      </main>

      <!-- 4. Футер зі статистикою по озелененню -->
      <footer class="footer-stats">
        <div class="stat-item">
          <span class="stat-label">HECTARES RESTORED</span>
          <span class="stat-value">12.4M</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">TREES PLANTED</span>
          <span class="stat-value">4.8B</span>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
